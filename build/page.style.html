<style>
/* 이 페이지 전용: 주제 강조색 하나 = 배터리 청록(--terrain 재사용) */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
@media(max-width:860px){.board{grid-template-columns:repeat(2,1fr)}}
.wst{display:block;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--rule);border-radius:10px;padding:8px 10px 9px;position:relative;line-height:1.45;min-height:96px}
.wst:hover{border-color:var(--info)}
.wst .no{font-size:12px;color:var(--muted)}
.wst b{display:block;font-size:14.5px;margin:1px 0 3px}
.wst .mv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lamp{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--rule);background:#fff;color:var(--muted)}
.lamp::before{content:"";width:8px;height:8px;border-radius:50%;background:#aab3bd}
.lamp.run{color:var(--amber);border-color:rgba(163,92,0,.4);background:var(--amber-soft)}.lamp.run::before{background:var(--amber)}
.lamp.ok{color:var(--gfp);border-color:rgba(19,115,58,.4);background:var(--gfp-soft)}.lamp.ok::before{background:var(--gfp)}
.lamp.ng{color:var(--eye);border-color:rgba(201,48,44,.4);background:var(--eye-soft)}.lamp.ng::before{background:var(--eye)}
.wst .lamp{position:absolute;right:8px;top:8px}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
@media(max-width:760px){.prods{grid-template-columns:1fr}}
.prod{border:1px solid var(--rule);border-radius:12px;padding:10px 14px;background:var(--panel)}
.prod h3{margin:0 0 6px;font-size:16.5px}
.prod .row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.prod .row span b{font-size:17px}
.shipbar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:6px 0 2px}
.shipbar i{display:block;height:100%;width:0;background:var(--gfp);transition:width .4s}
.qc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px dashed var(--rule);border-radius:10px;padding:8px 12px;margin:12px 0 4px;background:#fff;font-size:14.5px}
.qc .qn{font-weight:700}
.qc .qv{font-variant-numeric:tabular-nums}
.qc .qr{color:var(--muted);font-size:13.5px}
.slide{display:inline-block;font-size:12px;color:var(--info);border:1px solid rgba(30,85,200,.35);background:var(--info-soft);border-radius:6px;padding:0 7px;margin-left:6px;vertical-align:middle}
.fac{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:900px){.fac{grid-template-columns:1fr}}
.fac .cwrap canvas{height:470px}
@media(max-width:520px){.fac .cwrap canvas{height:360px}}
.pcard{border:1px solid var(--rule);border-radius:12px;padding:10px 14px;background:#fff}
.pcard h3{margin:2px 0 4px;font-size:17px}
.pcard .pc-no{font-size:12.5px;color:var(--muted)}
.pcard p{font-size:14.5px;margin:0 0 8px}
.pchips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.pchips button{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--text)}
.pchips button.done{background:var(--gfp-soft);border-color:rgba(19,115,58,.35)}
.pchips button.on{background:var(--gfp);color:#fff;border-color:var(--gfp)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin:6px 0}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--lc)}
.cards{display:grid;grid-template-columns:repeat(60,1fr);gap:1px;margin:8px 0}
@media(max-width:520px){.cards{grid-template-columns:repeat(30,1fr)}}
.cards i{display:block;aspect-ratio:1;border-radius:1px;background:#e3e6ef}
.cards i.d{background:#f3c9c7}
.cards i.on{background:var(--amber)}
.mat{display:inline-grid;gap:2px;vertical-align:top}
.mat i{display:block;width:16px;height:16px;border-radius:3px}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:3px;max-width:330px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.cm div{padding:6px 4px;border-radius:6px;background:var(--panel2)}
.cm .h{background:none;color:var(--muted);font-size:12px}
.cm .g{background:var(--gfp-soft);color:var(--gfp);font-weight:700}
.cm .r{background:var(--eye-soft);color:var(--eye);font-weight:700}
.cellbtns{display:flex;flex-wrap:wrap;gap:6px}
.datacard{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media(max-width:760px){.datacard{grid-template-columns:repeat(2,1fr)}}
.datacard div{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:#fff;font-size:14px;line-height:1.5}
.datacard b{display:block;font-size:15px}
.banner{display:none;border:2px solid var(--gfp);background:var(--gfp-soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700;color:var(--gfp)}
.banner.on{display:block}
.mnote{font-size:13px;color:var(--muted)}
#fac-minis{grid-template-columns:repeat(2,1fr)}
#fac-minis .mini b{font-size:17px}
</style>
